<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Fably - Dein magischer Kinderbuchgenerator</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fably">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      (function() {
        const isDark = localStorage.getItem('jammi_dark_mode') === 'true';
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        const theme = localStorage.getItem('jammi_theme') || 'orange';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
